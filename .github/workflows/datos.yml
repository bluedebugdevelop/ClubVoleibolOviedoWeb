name: Actualizar datos de competición

# Baja calendario, resultados y clasificaciones de las federaciones (FVBPA y
# RFEVB) y, si algo ha cambiado, commitea el JSON. El push dispara el
# despliegue en Railway, así que la web se actualiza sola.

on:
  schedule:
    # Todos los días a las 00:00 hora peninsular.
    #
    # GitHub programa los cron en UTC y no entiende de horarios de verano, así
    # que se ponen las dos horas que corresponden a la medianoche española y el
    # propio job descarta la que no toca. Sin esto, media temporada se
    # actualizaría a las 23:00 y la otra media a la 01:00.
    - cron: '0 23 * * *' # medianoche en horario de verano (CEST, UTC+2)
    - cron: '0 22 * * *' # medianoche en horario de invierno (CET, UTC+1)
  workflow_dispatch: # botón de "ejecutar ahora" en la pestaña Actions

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # De los dos cron programados solo vale el que ahora mismo cae a
      # medianoche en España; el otro se para aquí. Las ejecuciones a mano
      # (workflow_dispatch) siempre siguen.
      - name: ¿Es medianoche en España?
        id: hora
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          hora_es=$(TZ=Europe/Madrid date +%H)
          if [ "$hora_es" = "00" ]; then
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          else
            echo "En España son las $hora_es:00, no medianoche. Se salta."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == 'si'

      - uses: actions/setup-node@v4
        if: steps.hora.outputs.seguir == 'si'
        with:
          node-version: 20

      # El scraper no usa dependencias, así que no hace falta npm install.
      - name: Bajar datos de las federaciones
        if: steps.hora.outputs.seguir == 'si'
        run: npm run datos

      - name: Commitear si hay cambios
        if: steps.hora.outputs.seguir == 'si'
        run: |
          git config user.name  "bluedebugdevelop"
          git config user.email "256811162+bluedebugdevelop@users.noreply.github.com"

          # También `temporadas/`: al cambiar de temporada el scraper guarda ahí
          # una copia de la que se cierra, y ese fichero nace SIN seguimiento.
          # Mirando solo competicion.json se commiteaba la temporada nueva y se
          # perdía la vieja en el runner, una vez al año y sin avisar.
          mkdir -p src/data/temporadas
          git add -A src/data/competicion.json src/data/temporadas

          if git diff --cached --quiet; then
            echo "Sin cambios en los datos: no se commitea."
            exit 0
          fi

          git commit -m "datos: actualizar calendario y clasificaciones

          Generado automáticamente desde fvbpa.com y esvoley.es."
          git push
