<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Icono de pestana: el escudo redibujado, no la variante del monograma.
         El SVG lo usan los navegadores modernos y se ve nitido a cualquier
         tamano; los PNG son el respaldo y el icono de pantalla de inicio.
         Generados con System.Drawing desde public/media/escudo.png. -->
    <link rel="icon" type="image/svg+xml" href="/escudo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Voleibol Oviedo</title>
    <meta
      name="description"
      content="Club Voleibol Oviedo, fundado en 1991. Equipos en Superliga 2 Masculino, Primera Nacional Femenina y una cantera de 9 equipos en el Polideportivo José Manuel Fuente, Colloto."
    />
    <!-- Abierta a buscadores el 11-08-2026: ya hay dominio propio
         (clubvoleiboloviedo.com) y la web esta publicada. Antes iba con
         `noindex, nofollow` porque el contenido era de muestra. Si algun dia
         hay que volver a cerrarla, es esta linea y public/robots.txt. -->
    <!-- `max-image-preview:large` es lo que autoriza a Google a sacar la foto
         grande junto al resultado. Sin esta linea la vista previa se queda en
         el tamano por defecto y el resultado sale solo con texto. Va tambien en
         `src/seo.js`, que reescribe esta misma etiqueta en cada ruta. -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Estos valores son los de reserva, los que ven los robots que NO
         ejecutan JavaScript (WhatsApp, X, Telegram al generar la vista previa
         del enlace). Google sí ejecuta el JS, así que en su caso manda lo que
         reescribe `src/seo.js` en cada ruta. -->
    <link rel="canonical" href="https://clubvoleiboloviedo.com/" />
    <meta property="og:site_name" content="Club Voleibol Oviedo" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clubvoleiboloviedo.com/" />
    <meta property="og:title" content="Club Voleibol Oviedo · Voleibol en Oviedo desde 1991" />
    <meta
      property="og:description"
      content="Club de voleibol de Oviedo fundado en 1991. Superliga 2 Masculino, Primera Nacional Femenina y 9 equipos de cantera en el Polideportivo José Manuel Fuente, Colloto."
    />
    <meta property="og:image" content="https://clubvoleiboloviedo.com/media/hero-poster.jpg" />
    <!-- las medidas reales del fichero: sin ellas algunos robots descartan la
         imagen antes de descargarla -->
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Equipo del Club Voleibol Oviedo en el Polideportivo José Manuel Fuente" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Datos estructurados: es lo que le dice a Google que esto es un club
         deportivo de Oviedo y no una página cualquiera que menciona Oviedo. De
         aquí salen el panel de la derecha y los enlaces a las redes.
         Los datos son los mismos de `src/data/contenido.js` (club): si cambian
         allí, cambiarlos aquí. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsClub",
        "@id": "https://clubvoleiboloviedo.com/#club",
        "name": "Club Voleibol Oviedo",
        "alternateName": ["CV Oviedo", "Voleibol Oviedo"],
        "sport": "Voleibol",
        "foundingDate": "1991",
        "url": "https://clubvoleiboloviedo.com/",
        "logo": "https://clubvoleiboloviedo.com/escudo.svg",
        "image": "https://clubvoleiboloviedo.com/media/hero-poster.jpg",
        "email": "info@clubvoleiboloviedo.com",
        "telephone": "+34645719950",
        "description": "Club de voleibol de Oviedo fundado en 1991. Compite en Superliga 2 Masculino y Primera Nacional Femenina, y tiene nueve equipos de cantera.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle Luis Suárez Ximielga, s/n (Colloto)",
          "addressLocality": "Oviedo",
          "postalCode": "33010",
          "addressRegion": "Asturias",
          "addressCountry": "ES"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 43.3768593,
          "longitude": -5.7939339
        },
        "areaServed": {
          "@type": "City",
          "name": "Oviedo"
        },
        "sameAs": [
          "https://www.instagram.com/clubvoleiboloviedo/",
          "https://www.facebook.com/voleiboloviedo"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
